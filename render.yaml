databases:
  - name: rifa-db
    plan: free
    databaseName: rifa
    user: rifa

services:
  - type: web
    name: rifa-digital
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rifa-db
          property: connectionString
      - key: RIFA_ADMIN_PASSWORD
        generateValue: true
      - key: RIFA_SECRET
        generateValue: true
